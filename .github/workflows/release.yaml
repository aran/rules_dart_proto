# Cut a release when a version tag is pushed. Tags are pushed by hand, at the
# version rules_dart just released (CONTRIBUTING.md, "Releasing").
name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
  actions: read # read the CI result for the tagged commit
jobs:
  release:
    uses: aran/rules_dart/.github/workflows/overhead-release.yaml@2d78bccaa5ce13d09810ab85cc185a38e8f42d40
    with:
      release_files: rules_dart_proto-*.tar.gz
      tag_name: ${{ github.ref_name }}
  publish:
    needs: release
    uses: aran/rules_dart/.github/workflows/overhead-publish.yaml@2d78bccaa5ce13d09810ab85cc185a38e8f42d40
    with:
      tag_name: ${{ github.ref_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
    permissions:
      attestations: write
      contents: write
      id-token: write
