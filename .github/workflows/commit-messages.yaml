# Checks every commit pushed to main against the commit policy in AGENTS.md.
name: Commit messages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: aran/rules_dart/.github/workflows/overhead-commit-messages.yaml@a910ecfd53a496ec571f125f0ab0aebae6cc425e
    with:
      # Bump to start the Bazel caches afresh (see CACHE_VERSION in ci.yaml).
      cache-version: "1"
