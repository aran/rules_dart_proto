# Checks every commit pushed to main against the commit policy in AGENTS.md.
name: Commit messages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: aran/rules_dart/.github/workflows/overhead-commit-messages.yaml@2d78bccaa5ce13d09810ab85cc185a38e8f42d40
    with:
      # Bump to start the Bazel caches afresh (see CACHE_VERSION in ci.yaml).
      cache-version: "1"
