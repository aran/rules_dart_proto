name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run to catch upstream breakage (new Dart SDK, Bazel, deps)
  schedule:
    - cron: "0 9 * * 1"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
env:
  # Part of every setup-bazel cache key below. A cache restored on an exact key
  # hit is never saved again, so it freezes at whatever the first run put in
  # it; bump this number to start the caches afresh. A reusable workflow's
  # inputs cannot read `env`, so the `test` job takes it through the YAML
  # anchor. The Commit messages workflow (commit-messages.yaml) passes its
  # own: bump that one too.
  CACHE_VERSION: &cache_version "1"
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  # Every job below that runs its own steps has a timeout: 15 minutes for checks
  # that run one or two commands, 30 for a Bazel build or query of one
  # workspace. A caller of a reusable workflow (`test`) cannot set one.
  test:
    uses: bazel-contrib/.github/.github/workflows/bazel.yaml@1d798ff015ed0696433e01e2c3ccbb2abefadad7 # v7.7.0
    with:
      bazel_versions: '["9.3.0"]'
      cache_version: *cache_version
      # Exit code 4 means "build succeeded but no test targets found", which is
      # expected for build-only e2e folders.
      # Wrapped in bash -c because the reusable workflow uses the runner's
      # default shell (PowerShell on Windows) where [ $? -eq 4 ] is invalid.
      # Inner single quotes prevent the outer shell from expanding $?.
      bazel_test_command: "bash -c 'bazel test --test_output=errors //... || [ $? -eq 4 ]'"
      folders: |
        [
          ".",
          "e2e/simple_proto",
          "e2e/grpc_proto",
          "e2e/diamond_proto",
          "e2e/deep_import_proto",
          "e2e/analysis_pkg",
          "e2e/import_roots"
        ]
  # Every MODULE.bazel.lock is complete without anyone's .bazelrc.user, the
  # bazelrc preset is the one overhead generates, and this workflow covers every
  # workspace and gates on every job.
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          repository-cache: true
      - name: MODULE.bazel.lock files
        run: bazel run @overhead//locks:check
      - name: bazelrc preset
        run: bazel run @overhead//preset -- --check
      - name: CI workflow
        run: bazel run @overhead//ci:check
  # Every hook in .pre-commit-config.yaml, with the prek overhead pins, as a
  # commit runs them: one build puts overhead's tools in .bazel_env, then the
  # hooks run them without Bazel.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          repository-cache: true
      - run: bazel run --noincompatible_auto_exec_groups @overhead//:bazel_env -- update-symlink
      - run: bazel run --noincompatible_auto_exec_groups @overhead//lint:prek -- run --all-files --show-diff-on-failure
  # A consumer can query every package of the published module. Dev-only
  # tooling loads repos a consumer never sees, so it lives in directories
  # REPO.bazel keeps out of the module's packages.
  consumer-query:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          repository-cache: true
      - name: Query the whole published module from a consumer
        working-directory: e2e/simple_proto
        run: bazel query "@rules_dart_proto//..."
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs: [test, lockfiles, pre-commit, consumer-query]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
