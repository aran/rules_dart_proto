# See CONTRIBUTING.md for instructions.
# Hooks run with prek (https://github.com/j178/prek), which reads this
# pre-commit format. See https://pre-commit.com/hooks.html for more hooks
# The commit message check runs in commit-msg stage
# but we don't want to run the other hooks on commit messages
default_stages: [pre-commit]
# One `prek install` sets up both stages
default_install_hook_types: [pre-commit, commit-msg]
# Use a slightly older version of node by default
# as the default uses a very new version of GLIBC
default_language_version:
  node: 16.18.0
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Check formatting and lint for starlark code
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 10.1.0
    hooks:
      - id: buildifier
      - id: buildifier-lint
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
  # The hooks overhead supplies, at the versions it pins: the commit message
  # policy in AGENTS.md (a conventional-commit subject and the `Changelog:`
  # trailer rules), yamlfmt and typos.
  - repo: local
    hooks:
      - id: commit-message
        name: commit message policy
        entry: bazel run --ui_event_filters=-info --noshow_progress --show_result=0 @overhead//changelog:check --
        language: system
        stages: [commit-msg]
      - id: yamlfmt
        name: yamlfmt
        entry: bazel run --ui_event_filters=-info --noshow_progress --show_result=0 @overhead//lint:yamlfmt --
        language: system
        types: [yaml]
      - id: typos
        name: typos
        entry: bazel run --ui_event_filters=-info --noshow_progress --show_result=0 @overhead//lint:typos -- --force-exclude
        language: system
        types: [text]
